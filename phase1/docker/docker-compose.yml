# Docker Compose para Benchmark Científico - Fase 1
# Ambiente isolado e deterministico

version: '3.8'

services:
  pivotphp-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: phase1-pivotphp-core
    ports:
      - "8080:8080"
    volumes:
      - ../results:/app/results
      - ../config:/app/config:ro
    environment:
      - PHP_ENV=benchmark
      - BENCHMARK_PHASE=1
      - BENCHMARK_SEED=42
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    networks:
      - benchmark-network
    command: php -S 0.0.0.0:8080 -t /app/public

  # Monitoring container para coleta de métricas
  monitor:
    image: alpine:latest
    container_name: phase1-monitor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../results:/results
    command: |
      sh -c "
        apk add --no-cache docker-cli procps &&
        while true; do
          docker stats --no-stream --format 'table {{.Container}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}\t{{.PIDs}}' phase1-pivotphp-core >> /results/system_metrics.log
          sleep 1
        done
      "
    depends_on:
      - pivotphp-core
    networks:
      - benchmark-network

networks:
  benchmark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16