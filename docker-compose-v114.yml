# Docker Compose para PivotPHP v1.1.4 Benchmarks
# Ambiente isolado para testes de performance com todas as phases

services:

  # === PHASE 1: PivotPHP Core v1.1.4 ===
  pivotphp-core-v114:
    build:
      context: ./phase1
      dockerfile: Dockerfile-v114
    container_name: pivotphp-core-v114
    ports:
      - "8080:80"
    volumes:
      - ./phase1/results:/var/www/html/results
      - ./phase1/config:/var/www/html/config:ro
    environment:
      - APP_ENV=benchmark
      - APP_DEBUG=false
      - BENCHMARK_PHASE=1
      - PIVOTPHP_VERSION=1.1.4
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "pivotphp.version=1.1.4"
      - "pivotphp.edition=Enhanced"
      - "benchmark.phase=1"
      - "benchmark.type=core"

  # === PHASE 2: PivotPHP + Cycle ORM v1.1.4 ===
  pivotphp-orm-v114:
    build:
      context: ./phase2
      dockerfile: docker/Dockerfile-orm
    container_name: pivotphp-orm-v114
    ports:
      - "8081:80"
    volumes:
      - ./phase2/results:/var/www/html/results
      - ./phase2/config:/var/www/html/config:ro
    environment:
      - APP_ENV=benchmark
      - APP_DEBUG=false
      - BENCHMARK_PHASE=2
      - PIVOTPHP_VERSION=1.1.4
      - DATABASE_URL=mysql://benchmark:benchmark@mysql-benchmark:3306/benchmark
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
    depends_on:
      mysql-benchmark:
        condition: service_healthy
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "pivotphp.version=1.1.4"
      - "pivotphp.edition=Enhanced"
      - "benchmark.phase=2"
      - "benchmark.type=orm"


  # === INFRAESTRUTURA ===

  # MySQL para testes ORM
  mysql-benchmark:
    image: mysql:8.0
    container_name: mysql-benchmark-v114
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=benchmark
      - MYSQL_DATABASE=benchmark
      - MYSQL_USER=benchmark
      - MYSQL_PASSWORD=benchmark
    volumes:
      - mysql-data:/var/lib/mysql
      - ./phase2/docker/mysql-config.cnf:/etc/mysql/conf.d/benchmark.cnf:ro
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benchmark", "-pbenchmark"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "benchmark.service=database"
      - "benchmark.version=mysql-8.0"

  # Redis para cache (opcional)
  redis-benchmark:
    image: redis:7-alpine
    container_name: redis-benchmark-v114
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "benchmark.service=cache"
      - "benchmark.version=redis-7"

  # === FERRAMENTAS DE MONITORING ===

  # Container para executar benchmarks
  benchmark-runner:
    build:
      context: .
      dockerfile: Dockerfile-runner
    container_name: benchmark-runner-v114
    volumes:
      - ./results:/app/results
      - ./scripts:/app/scripts:ro
      - .:/app/source:ro
    environment:
      - PIVOTPHP_VERSION=1.1.4
      - BENCHMARK_ITERATIONS=10000
      - BENCHMARK_WARMUP=1000
    networks:
      - benchmark-network
    depends_on:
      - pivotphp-core-v114
      - pivotphp-orm-v114
    profiles:
      - tools
    command: tail -f /dev/null
    labels:
      - "benchmark.tool=runner"
      - "pivotphp.version=1.1.4"

# === NETWORKS ===
networks:
  benchmark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# === VOLUMES ===
volumes:
  mysql-data:
    driver: local
    labels:
      - "benchmark.volume=database"
  redis-data:
    driver: local
    labels:
      - "benchmark.volume=cache"

# === CONFIGURAÇÕES GLOBAIS ===
x-common-variables: &common-variables
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

x-resource-limits: &resource-limits
  cpus: '2.0'
  memory: 1G

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s