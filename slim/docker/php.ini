; PHP tuning para benchmark (idêntico entre frameworks).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=0
opcache.revalidate_freq=0

memory_limit=256M
expose_php=Off

; Mitigação CVE-2026-115560 (sem correção ainda) e defesa adicional contra CVE-2026-109619.
; O benchmark não usa upload progress de sessão.
session.upload_progress.enabled=0
