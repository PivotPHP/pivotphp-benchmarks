# Docker Compose para PivotPHP v1.2.0 Benchmarks
# "Simplicidade sobre Otimização Prematura" Edition
# Ambiente reimaginado para testes de performance com recursos simplificados

services:

  # === PHASE 1: PivotPHP Core v1.2.0 (Simplified Architecture) ===
  pivotphp-core-v120:
    build:
      context: ./phase1
      dockerfile: Dockerfile-v120
    container_name: pivotphp-core-v120
    ports:
      - "8090:80"
    volumes:
      - ./phase1/results:/var/www/html/results
      - ./phase1/config:/var/www/html/config:ro
    environment:
      - APP_ENV=benchmark
      - APP_DEBUG=false
      - BENCHMARK_PHASE=1
      - PIVOTPHP_VERSION=1.2.0
      - PIVOTPHP_PHILOSOPHY="Simplicidade sobre Otimização Prematura"
      - PIVOTPHP_EDITION="Reimagined Architecture"
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - OPENAPI_ENABLED=true
      - SWAGGER_UI_ENABLED=true
      - SIMPLIFIED_ARCHITECTURE=true
    networks:
      - benchmark-network-v120
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "pivotphp.version=1.2.0"
      - "pivotphp.edition=Reimagined"
      - "pivotphp.philosophy=Simplicidade sobre Otimização Prematura"
      - "benchmark.phase=1"
      - "benchmark.type=core"
      - "openapi.enabled=true"
      - "swagger.ui=http://localhost:8080/swagger"

  # === PHASE 2: PivotPHP + Cycle ORM v1.2.0 (Simplified) ===
  pivotphp-orm-v120:
    build:
      context: ./phase2
      dockerfile: docker/Dockerfile-orm-v120
    container_name: pivotphp-orm-v120
    ports:
      - "8091:80"
    volumes:
      - ./phase2/results:/var/www/html/results
      - ./phase2/config:/var/www/html/config:ro
    environment:
      - APP_ENV=benchmark
      - APP_DEBUG=false
      - BENCHMARK_PHASE=2
      - PIVOTPHP_VERSION=1.2.0
      - PIVOTPHP_PHILOSOPHY="Simplicidade sobre Otimização Prematura"
      - EXTENSION_TYPE=orm
      - CYCLE_ORM_ENABLED=true
      - OPENAPI_ENABLED=true
      - SWAGGER_UI_ENABLED=true
      - SIMPLIFIED_ORM=true
      - DATABASE_URL=mysql://benchmark:benchmark@mysql-v120:3306/benchmark
      - REDIS_URL=redis://redis-v120:6379
    depends_on:
      mysql-v120:
        condition: service_healthy
      redis-v120:
        condition: service_healthy
    networks:
      - benchmark-network-v120
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "pivotphp.version=1.2.0"
      - "pivotphp.extension=cycle-orm"
      - "benchmark.phase=2"
      - "benchmark.type=orm"
      - "openapi.orm=http://localhost:8081/openapi.json"

  # === MYSQL Database v8.0 (Para testes ORM) ===
  mysql-v120:
    image: mysql:8.0
    container_name: mysql-benchmark-v120
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: benchmark
      MYSQL_DATABASE: benchmark
      MYSQL_USER: benchmark
      MYSQL_PASSWORD: benchmark
    volumes:
      - mysql-data-v120:/var/lib/mysql
      - ./phase2/docker/mysql.cnf:/etc/mysql/conf.d/benchmark.cnf:ro
      - ./phase3/ecosystem-validation/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - benchmark-network-v120
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benchmark", "-pbenchmark"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "service.type=database"
      - "service.version=mysql-8.0"

  # === REDIS Cache v7 (Para testes de cache) ===
  redis-v120:
    image: redis:7-alpine
    container_name: redis-benchmark-v120
    ports:
      - "6380:6379"
    volumes:
      - redis-data-v120:/data
      - ./phase2/docker/redis.conf:/etc/redis/redis.conf:ro
    command: redis-server /etc/redis/redis.conf
    networks:
      - benchmark-network-v120
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "service.type=cache"
      - "service.version=redis-7"

  # === PHASE 3: Ecosystem Validation v1.2.0 ===
  pivotphp-ecosystem-v120:
    build:
      context: ./phase3
      dockerfile: docker/Dockerfile-ecosystem-v120
    container_name: pivotphp-ecosystem-v120
    ports:
      - "8093:80"
    volumes:
      - ./phase3/results:/var/www/html/results
      - ./results:/var/www/html/shared-results
    environment:
      - APP_ENV=benchmark
      - BENCHMARK_PHASE=3
      - PIVOTPHP_VERSION=1.2.0
      - ECOSYSTEM_MODE=full
      - VALIDATION_TYPE=comprehensive
      - OPENAPI_ECOSYSTEM=true
      - SIMPLIFIED_VALIDATION=true
      - CORE_URL=http://pivotphp-core-v120
      - ORM_URL=http://pivotphp-orm-v120  
    depends_on:
      pivotphp-core-v120:
        condition: service_healthy
      pivotphp-orm-v120:
        condition: service_healthy
    networks:
      - benchmark-network-v120
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 35s
    labels:
      - "pivotphp.version=1.2.0"
      - "benchmark.phase=3"
      - "benchmark.type=ecosystem"
      - "validation.comprehensive=true"

  # === Benchmark Runner (Orquestrador) ===
  benchmark-runner-v120:
    build:
      context: .
      dockerfile: docker/Dockerfile-runner-v120
    container_name: benchmark-runner-v120
    volumes:
      - .:/app
      - ./results:/app/results
    environment:
      - BENCHMARK_MODE=v120
      - PHILOSOPHY="Simplicidade sobre Otimização Prematura"
      - ITERATIONS=10000
      - WARMUP=1000
      - CORE_URL=http://pivotphp-core-v120
      - ORM_URL=http://pivotphp-orm-v120
      - ECOSYSTEM_URL=http://pivotphp-ecosystem-v120
    depends_on:
      pivotphp-core-v120:
        condition: service_healthy
      pivotphp-orm-v120:
        condition: service_healthy
      pivotphp-ecosystem-v120:
        condition: service_healthy
    networks:
      - benchmark-network-v120
    restart: "no"
    labels:
      - "service.type=benchmark-orchestrator"
      - "pivotphp.version=1.2.0"

# === VOLUMES ===
volumes:
  mysql-data-v120:
    name: pivotphp-mysql-data-v120
    labels:
      - "service.type=database-storage"
      - "pivotphp.version=1.2.0"
  
  redis-data-v120:
    name: pivotphp-redis-data-v120
    labels:
      - "service.type=cache-storage"
      - "pivotphp.version=1.2.0"

# === NETWORKS ===
networks:
  benchmark-network-v120:
    name: pivotphp-benchmark-v120
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    labels:
      - "pivotphp.version=1.2.0"
      - "network.type=benchmark"
      - "philosophy=Simplicidade sobre Otimização Prematura"

# === CONFIGURAÇÕES GLOBAIS ===
x-common-variables: &common-env
  PIVOTPHP_VERSION: "1.2.0"
  PIVOTPHP_PHILOSOPHY: "Simplicidade sobre Otimização Prematura"
  PIVOTPHP_EDITION: "Reimagined Architecture"
  BENCHMARK_DATE: "2025-07-21"
  OPENAPI_VERSION: "3.0.0"
  SIMPLIFIED_MODE: "true"
  BACKWARD_COMPATIBLE: "true"
  ZERO_BREAKING_CHANGES: "true"

x-common-labels: &common-labels
  pivotphp.version: "1.2.0"
  pivotphp.philosophy: "Simplicidade sobre Otimização Prematura"
  pivotphp.edition: "Reimagined Architecture"
  benchmark.suite: "comprehensive"
  openapi.enabled: "true"
  swagger.ui: "true"
  simplified.architecture: "true"
  backward.compatibility: "100%"