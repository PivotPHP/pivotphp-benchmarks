# Docker Compose para Phase 3 - PivotPHP v1.1.4 vs Slim 4
# Comparação científica cross-framework

version: '3.8'

services:

  # === PIVOTPHP v1.1.4 ===
  pivotphp-v114:
    build:
      context: ../
      dockerfile: docker/Dockerfile-pivotphp-v114
    container_name: pivotphp-phase3-v114
    ports:
      - "8083:80"
    volumes:
      - ../results:/var/www/html/results
      - ../config:/var/www/html/config:ro
    environment:
      - APP_ENV=benchmark
      - APP_DEBUG=false
      - BENCHMARK_PHASE=3
      - PIVOTPHP_VERSION=1.1.4
      - PIVOTPHP_EDITION=Architectural Excellence & Performance Optimization Edition
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - HIGH_PERFORMANCE_MODE=PROFILE_HIGH
    networks:
      - phase3-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "pivotphp.version=1.1.4"
      - "pivotphp.edition=Architectural Excellence"
      - "benchmark.phase=3"
      - "benchmark.type=pivotphp"

  # === SLIM 4 ===
  slim4-benchmark:
    build:
      context: ../
      dockerfile: docker/Dockerfile-slim4
    container_name: slim4-phase3-benchmark
    ports:
      - "8084:80"
    volumes:
      - ../results:/var/www/html/results
      - ../config:/var/www/html/config:ro
    environment:
      - APP_ENV=benchmark
      - APP_DEBUG=false
      - BENCHMARK_PHASE=3
      - SLIM_VERSION=4.14
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - DISPLAY_ERRORS=off
    networks:
      - phase3-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "slim.version=4.14"
      - "benchmark.phase=3"
      - "benchmark.type=slim4"

  # === MYSQL PARA TESTES ORM ===
  mysql-phase3:
    image: mysql:8.0
    container_name: mysql-phase3-benchmark
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=benchmark
      - MYSQL_DATABASE=benchmark
      - MYSQL_USER=benchmark
      - MYSQL_PASSWORD=benchmark
    volumes:
      - mysql-phase3-data:/var/lib/mysql
      - ../config/mysql.cnf:/etc/mysql/conf.d/benchmark.cnf:ro
    networks:
      - phase3-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benchmark", "-pbenchmark"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      - "benchmark.service=database"
      - "benchmark.phase=3"

  # === REDIS PARA CACHE ===
  redis-phase3:
    image: redis:7-alpine
    container_name: redis-phase3-benchmark
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-phase3-data:/data
    networks:
      - phase3-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "benchmark.service=cache"
      - "benchmark.phase=3"

  # === BENCHMARK RUNNER ===
  benchmark-runner-phase3:
    build:
      context: ../
      dockerfile: docker/Dockerfile-runner
    container_name: benchmark-runner-phase3
    volumes:
      - ../results:/app/results
      - ../benchmarks:/app/benchmarks:ro
      - ../config:/app/config:ro
    environment:
      - BENCHMARK_PHASE=3
      - PIVOTPHP_VERSION=1.1.4
      - SLIM_VERSION=4.14
      - BENCHMARK_ITERATIONS=200
      - BENCHMARK_WARMUP=50
    networks:
      - phase3-network
    depends_on:
      - pivotphp-v114
      - slim4-benchmark
      - mysql-phase3
      - redis-phase3
    profiles:
      - tools
    command: tail -f /dev/null
    labels:
      - "benchmark.tool=runner"
      - "benchmark.phase=3"

# === NETWORKS ===
networks:
  phase3-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

# === VOLUMES ===
volumes:
  mysql-phase3-data:
    driver: local
    labels:
      - "benchmark.volume=database"
      - "benchmark.phase=3"
  redis-phase3-data:
    driver: local
    labels:
      - "benchmark.volume=cache"
      - "benchmark.phase=3"

# === CONFIGURAÇÕES GLOBAIS ===
x-common-variables: &common-variables
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

x-resource-limits: &resource-limits
  cpus: '2.0'
  memory: 1G

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 10s