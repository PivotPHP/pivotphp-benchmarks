# PivotPHP Full Ecosystem - Cross-Framework Compatible
# Configuração equivalente aos outros frameworks do benchmark

networks:
  benchmark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16

services:
  # === PivotPHP Full Ecosystem (Cross-Framework Compatible) ===
  pivotphp-full-ecosystem:
    build:
      context: .
      dockerfile: docker/Dockerfile-full-ecosystem-compatible
    container_name: pivotphp-full-ecosystem
    ports:
      - "8080:80"
    volumes:
      - ../results:/var/www/html/results
      - ./ecosystem-app:/var/www/html/app:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - BENCHMARK_MODE=cross_framework
      - PIVOTPHP_VERSION=1.1.4
      - DATABASE_URL=mysql://benchmark:benchmark@mysql-ecosystem:3306/benchmark
      - REDIS_URL=redis://redis-ecosystem:6379/0
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_JIT=1255
      - PHP_OPCACHE_JIT_BUFFER_SIZE=256M
    depends_on:
      mysql-ecosystem:
        condition: service_healthy
      redis-ecosystem:
        condition: service_healthy
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "framework=pivotphp"
      - "version=1.1.4"
      - "type=full-ecosystem"
      - "benchmark.cross_framework=true"

  # === PivotPHP Core Only (Para comparação) ===
  pivotphp-core:
    build:
      context: .
      dockerfile: docker/Dockerfile-core-compatible
    container_name: pivotphp-core
    ports:
      - "8081:80"
    volumes:
      - ../results:/var/www/html/results
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - BENCHMARK_MODE=cross_framework
      - PIVOTPHP_VERSION=1.1.4
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_JIT=1255
      - PHP_OPCACHE_JIT_BUFFER_SIZE=256M
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "framework=pivotphp"
      - "version=1.1.4"
      - "type=core"
      - "benchmark.cross_framework=true"

  # === INFRAESTRUTURA (Equivalente aos outros frameworks) ===
  
  mysql-ecosystem:
    image: mysql:8.0
    container_name: mysql-ecosystem
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=benchmark
      - MYSQL_DATABASE=benchmark
      - MYSQL_USER=benchmark
      - MYSQL_PASSWORD=benchmark
    volumes:
      - mysql-ecosystem-data:/var/lib/mysql
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benchmark", "-pbenchmark"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  redis-ecosystem:
    image: redis:7-alpine
    container_name: redis-ecosystem
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-ecosystem-data:/data
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === BENCHMARK RUNNER (Equivalente aos outros frameworks) ===
  
  cross-framework-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile-benchmark-compatible
    container_name: cross-framework-runner
    volumes:
      - ../results:/var/www/results
      - .:/var/www/benchmark:ro
    environment:
      - BENCHMARK_FRAMEWORK=pivotphp-full-ecosystem
      - BENCHMARK_TARGET_URL=http://pivotphp-full-ecosystem/api
      - BENCHMARK_ITERATIONS=10000
      - BENCHMARK_WARMUP=1000
      - BENCHMARK_CONCURRENT_USERS=1
    networks:
      - benchmark-network
    depends_on:
      pivotphp-full-ecosystem:
        condition: service_healthy
      pivotphp-core:
        condition: service_healthy
    command: tail -f /dev/null
    labels:
      - "benchmark.tool=cross_framework_runner"

  # === MONITORING (Para análise de performance) ===
  
  htop-monitor:
    image: alpine:latest
    container_name: ecosystem-monitor
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    command: sh -c "apk add --no-cache htop && tail -f /dev/null"
    networks:
      - benchmark-network
    profiles:
      - monitoring

# === VOLUMES ===
volumes:
  mysql-ecosystem-data:
    driver: local
    labels:
      - "benchmark.volume=mysql_ecosystem"
  redis-ecosystem-data:
    driver: local
    labels:
      - "benchmark.volume=redis_ecosystem"

# === CONFIGURAÇÕES GLOBAIS ===
x-common-php-config: &php-config
  PHP_MEMORY_LIMIT: 512M
  PHP_MAX_EXECUTION_TIME: 0
  PHP_OPCACHE_ENABLE: 1
  PHP_OPCACHE_ENABLE_CLI: 1
  PHP_OPCACHE_JIT: 1255
  PHP_OPCACHE_JIT_BUFFER_SIZE: 256M
  PHP_OPCACHE_MEMORY_CONSUMPTION: 256
  PHP_OPCACHE_MAX_ACCELERATED_FILES: 20000
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0

x-resource-standard: &resource-standard
  cpus: '2.0'
  memory: 1G

x-healthcheck-standard: &healthcheck-standard
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s