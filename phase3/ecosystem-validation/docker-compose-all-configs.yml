# PivotPHP All Configurations - Cross-Framework Compatible
# Testa todas as variações: Core, Core+ReactPHP, Core+ORM, Full Ecosystem

networks:
  benchmark-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

services:
  # === 1. PivotPHP Core Only ===
  pivotphp-core-only:
    build:
      context: .
      dockerfile: docker/Dockerfile-pivotphp-core-only
    container_name: pivotphp-core-only
    ports:
      - "8080:80"
    volumes:
      - ../results:/var/www/html/results
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - PIVOTPHP_CONFIG=core_only
      - PIVOTPHP_VERSION=1.1.4
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_JIT=1255
      - PHP_OPCACHE_JIT_BUFFER_SIZE=256M
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "framework=pivotphp"
      - "config=core_only"
      - "benchmark.cross_framework=true"

  # === 2. PivotPHP Core + ReactPHP ===
  pivotphp-core-reactphp:
    build:
      context: .
      dockerfile: docker/Dockerfile-pivotphp-core-reactphp
    container_name: pivotphp-core-reactphp
    ports:
      - "8081:80"
    volumes:
      - ../results:/var/www/html/results
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - PIVOTPHP_CONFIG=core_reactphp
      - PIVOTPHP_VERSION=1.1.4
      - REACTPHP_ENABLED=true
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_JIT=1255
      - PHP_OPCACHE_JIT_BUFFER_SIZE=256M
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "framework=pivotphp"
      - "config=core_reactphp"
      - "benchmark.cross_framework=true"

  # === 3. PivotPHP Core + Cycle ORM ===
  pivotphp-core-orm:
    build:
      context: .
      dockerfile: docker/Dockerfile-pivotphp-core-orm
    container_name: pivotphp-core-orm
    ports:
      - "8082:80"
    volumes:
      - ../results:/var/www/html/results
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - PIVOTPHP_CONFIG=core_orm
      - PIVOTPHP_VERSION=1.1.4
      - DATABASE_URL=mysql://benchmark:benchmark@mysql-ecosystem:3306/benchmark
      - ORM_ENABLED=true
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_JIT=1255
      - PHP_OPCACHE_JIT_BUFFER_SIZE=256M
    depends_on:
      mysql-ecosystem:
        condition: service_healthy
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "framework=pivotphp"
      - "config=core_orm"
      - "benchmark.cross_framework=true"

  # === 4. PivotPHP Full Ecosystem (Core + ReactPHP + ORM) ===
  pivotphp-full-ecosystem:
    build:
      context: .
      dockerfile: docker/Dockerfile-pivotphp-full-ecosystem
    container_name: pivotphp-full-ecosystem
    ports:
      - "8083:80"
    volumes:
      - ../results:/var/www/html/results
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - PIVOTPHP_CONFIG=full_ecosystem
      - PIVOTPHP_VERSION=1.1.4
      - DATABASE_URL=mysql://benchmark:benchmark@mysql-ecosystem:3306/benchmark
      - REACTPHP_ENABLED=true
      - ORM_ENABLED=true
      - PHP_OPCACHE_VALIDATE_TIMESTAMPS=0
      - PHP_OPCACHE_JIT=1255
      - PHP_OPCACHE_JIT_BUFFER_SIZE=256M
    depends_on:
      mysql-ecosystem:
        condition: service_healthy
      redis-ecosystem:
        condition: service_healthy
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "framework=pivotphp"
      - "config=full_ecosystem"
      - "benchmark.cross_framework=true"

  # === INFRAESTRUTURA ===
  
  mysql-ecosystem:
    image: mysql:8.0
    container_name: mysql-ecosystem
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=benchmark
      - MYSQL_DATABASE=benchmark
      - MYSQL_USER=benchmark
      - MYSQL_PASSWORD=benchmark
    volumes:
      - mysql-ecosystem-data:/var/lib/mysql
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "benchmark", "-pbenchmark"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: --default-authentication-plugin=mysql_native_password

  redis-ecosystem:
    image: redis:7-alpine
    container_name: redis-ecosystem
    ports:
      - "6380:6379"
    command: redis-server --appendonly yes --maxmemory 256mb
    volumes:
      - redis-ecosystem-data:/data
    networks:
      - benchmark-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === BENCHMARK RUNNER ===
  
  all-configs-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile-all-configs-runner
    container_name: all-configs-runner
    volumes:
      - ../results:/var/www/results
      - .:/var/www/benchmark:ro
    environment:
      - BENCHMARK_ITERATIONS=1000
      - BENCHMARK_WARMUP=100
      - BENCHMARK_CONCURRENT_USERS=1
    networks:
      - benchmark-network
    depends_on:
      pivotphp-core-only:
        condition: service_healthy
      pivotphp-core-reactphp:
        condition: service_healthy
      pivotphp-core-orm:
        condition: service_healthy
      pivotphp-full-ecosystem:
        condition: service_healthy
    command: tail -f /dev/null
    labels:
      - "benchmark.tool=all_configs_runner"

volumes:
  mysql-ecosystem-data:
    driver: local
  redis-ecosystem-data:
    driver: local

# === CONFIGURAÇÕES GLOBAIS ===
x-common-php-config: &php-config
  PHP_MEMORY_LIMIT: 512M
  PHP_MAX_EXECUTION_TIME: 30
  PHP_OPCACHE_ENABLE: 1
  PHP_OPCACHE_ENABLE_CLI: 1
  PHP_OPCACHE_JIT: 1255
  PHP_OPCACHE_JIT_BUFFER_SIZE: 256M
  PHP_OPCACHE_MEMORY_CONSUMPTION: 256
  PHP_OPCACHE_MAX_ACCELERATED_FILES: 20000
  PHP_OPCACHE_VALIDATE_TIMESTAMPS: 0

x-resource-standard: &resource-standard
  cpus: '2.0'
  memory: 1G

x-healthcheck-standard: &healthcheck-standard
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s