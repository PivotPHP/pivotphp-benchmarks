framework:
    secret: '%env(APP_SECRET)%'
    
    # Disable CSRF for benchmarks
    csrf_protection: false
    
    # Session disabled for benchmarks
    session: false
    
    # Enable annotations
    annotations: false
    
    # PHP errors handling
    php_errors:
        log: false
    
    # Router configuration
    router:
        utf8: true
        
    # Validation
    validation:
        enabled: false