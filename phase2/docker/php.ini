; PHP Configuration for Phase 2 Benchmarks

; Basic configuration
memory_limit = 512M
max_execution_time = 300
max_input_time = 60
default_socket_timeout = 60

; Error reporting (minimal for benchmark performance)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /tmp/php_errors.log
error_reporting = E_ERROR | E_WARNING | E_PARSE

; OPcache configuration
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 0
opcache.fast_shutdown = 1

; JIT configuration (PHP 8.0+)
opcache.jit = 1235
opcache.jit_buffer_size = 64M

; Session configuration
session.auto_start = 0
session.cache_limiter = 
session.use_cookies = 0
session.use_trans_sid = 0

; Date/Time
date.timezone = UTC

; Output buffering
output_buffering = 4096
implicit_flush = Off

; File uploads (disabled for benchmarks)
file_uploads = Off

; Performance optimizations
realpath_cache_size = 32M
realpath_cache_ttl = 600

; MySQL specific
mysql.allow_persistent = On
mysql.max_persistent = -1
mysql.max_links = 200

; PDO
pdo_mysql.cache_size = 2000
pdo_mysql.default_socket =

; Memory limit for long-running processes (ReactPHP)
memory_limit = 1G